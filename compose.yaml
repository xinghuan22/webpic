services:
  image-gateway:
    build: .
    image: image-gateway:latest
    container_name: image-gateway
    restart: always
    read_only: true
    mem_limit: 256m
    pids_limit: 64
    cap_drop:
      - ALL
    environment:
      LISTEN: ':8080'
      MAX_PROXY_CONCURRENCY: '${MAX_PROXY_CONCURRENCY:-16}'
      METADATA_TTL_SECONDS: '${METADATA_TTL_SECONDS:-1200}'
      METADATA_CACHE_MAX: '${METADATA_CACHE_MAX:-1000}'
      GELBOORU_USER_ID: '${GELBOORU_USER_ID:-}'
      GELBOORU_API_KEY: '${GELBOORU_API_KEY:-}'
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      MANGA_PUBLISH_SECRET: '${MANGA_PUBLISH_SECRET:-}'
      MANGA_MANIFEST_DIR: '/data/manga/manifests'
      PUBLIC_BASE_URL: '${PUBLIC_BASE_URL:-https://image.lospro.kissnab.top}'
      JM_IMAGE_HOST_SUFFIXES: '${JM_IMAGE_HOST_SUFFIXES:-jmapiproxy1.cc,jmapiproxy2.cc,jmapinodeudzn.net,18comic.org,18comic.vip}'
      MAX_MANGA_DECODE_CONCURRENCY: '${MAX_MANGA_DECODE_CONCURRENCY:-2}'
      MAX_MANGA_IMAGE_MIB: '${MAX_MANGA_IMAGE_MIB:-24}'
      MAX_MANGA_MEGAPIXELS: '${MAX_MANGA_MEGAPIXELS:-40}'
      GOMEMLIMIT: '192MiB'
    volumes:
      - ./data/manga:/data/manga
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - data_kissnab
networks:
  data_kissnab:
    name: data_kissnab
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
